<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7" />
      <stop offset="0.5" stop-color="#6366F1" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" />
      <stop offset="1" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <!-- Outer Circle Badge -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="#E0F2FE" stroke-width="6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Science Atom Symbol -->
  <ellipse cx="100" cy="100" rx="60" ry="22" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="60" ry="22" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3" transform="rotate(90 100 100)"/>
  <ellipse cx="100" cy="100" rx="60" ry="22" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3" transform="rotate(150 100 100)"/>

  <!-- Nucleus & Flask -->
  <circle cx="100" cy="100" r="14" fill="url(#goldGrad)" />
  <path d="M92 118 L108 118 L116 138 C118 143 114 148 108 148 L92 148 C86 148 82 143 84 138 Z" fill="white" opacity="0.9"/>
  <circle cx="100" cy="132" r="3" fill="#0284C7"/>
  <circle cx="95" cy="138" r="2" fill="#8B5CF6"/>
  <circle cx="105" cy="136" r="2" fill="#EC4899"/>

  <!-- Text NWSP -->
  <text x="100" y="65" font-family="'Prompt', sans-serif" font-weight="900" font-size="20" fill="white" text-anchor="middle" letter-spacing="2">NWSP</text>
  <text x="100" y="172" font-family="'Prompt', sans-serif" font-weight="700" font-size="12" fill="#E0F2FE" text-anchor="middle">หนองวัวซอพิทยาคม</text>
</svg>
